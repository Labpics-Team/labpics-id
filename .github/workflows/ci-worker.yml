name: CI worker

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        description: Optional Codecov upload token
        required: false

permissions:
  contents: read

jobs:
  static:
    name: Static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Domain dependency gate
        run: bun run check:domain-gate
      - name: Typecheck all workspaces
        run: bun run typecheck
      - name: Lint (Biome)
        run: bun x biome lint .
      - name: Format check (Biome)
        run: bun x biome format .

  test:
    name: Unit + integration
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317
        env:
          POSTGRES_USER: labpics
          POSTGRES_PASSWORD: labpics-ci-password
          POSTGRES_DB: labpics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U labpics -d labpics"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://labpics:labpics-ci-password@localhost:5432/labpics
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Unit and integration tests with coverage
        run: bun test --timeout 120000 --coverage --coverage-reporter=lcov
      - name: Apply migrations
        run: bun --cwd packages/db run migrate
      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage-${{ github.run_attempt }}
          path: coverage/
          if-no-files-found: error
          retention-days: 14
      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@0561704f0f02c16a585d4c7555e57fa2e44cf909 # v5.5.2
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: true

  build:
    name: Build + bundle guard
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Build API, web, and packages
        run: bun run build
      - name: Enforce web client bundle budget
        shell: bash
        run: |
          set -euo pipefail
          test -d apps/web/.next/static
          bytes=$(du -sb apps/web/.next/static | cut -f1)
          budget=$((5 * 1024 * 1024))
          printf 'Next.js static bundle: %s bytes (budget: %s bytes)\n' "$bytes" "$budget" | tee bundle-size.txt
          test "$bytes" -le "$budget"
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: build-evidence-${{ github.run_attempt }}
          path: bundle-size.txt
          if-no-files-found: error
          retention-days: 14

  security:
    name: Security
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Scan complete history for secrets
        run: >-
          docker run --rm
          -v "${{ github.workspace }}:/repo"
          ghcr.io/gitleaks/gitleaks@sha256:bf00b5e039f0fad4b32935dc5ec1e358f227ccd097bcb64b971f0331072fe2ae
          git /repo --redact --report-format sarif --report-path /repo/gitleaks.sarif
      - name: Audit dependencies (high and critical block)
        shell: bash
        run: |
          set -euo pipefail
          bun audit --audit-level=high | tee dependency-audit.txt
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9da17a5aa4abec2340d6e6c8d8efb0770b1c9cb8 # v4.32.3
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Analyze critical application paths
        uses: github/codeql-action/analyze@9da17a5aa4abec2340d6e6c8d8efb0770b1c9cb8 # v4.32.3
        with:
          category: /language:javascript-typescript
      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: security-evidence-${{ github.run_attempt }}
          path: |
            dependency-audit.txt
            gitleaks.sarif
          if-no-files-found: warn
          retention-days: 30

  conformance-smoke:
    name: Conformance smoke
    needs: security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        if: ${{ hashFiles('test/protocol-conformance-smoke.test.ts') != '' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - name: Install for protocol conformance artifact
        if: ${{ hashFiles('test/protocol-conformance-smoke.test.ts') != '' }}
        run: bun install --frozen-lockfile
      - name: Run protocol conformance smoke artifact
        if: ${{ hashFiles('test/protocol-conformance-smoke.test.ts') != '' }}
        run: bun test test/protocol-conformance-smoke.test.ts --timeout 120000
      - name: Verify conformance integration point before artifact lands
        if: ${{ hashFiles('test/protocol-conformance-smoke.test.ts') == '' }}
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          grep -q '"name": "labpics-id"' package.json
          printf 'Protocol conformance integration point is healthy; artifact not landed yet.\n'

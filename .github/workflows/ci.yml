# Bootstrap CI for the Labpics ID scaffold.
# Actions are SHA-pinned (actions/checkout v7.0.1, oven-sh/setup-bun v2.2.0).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bootstrap:
    name: typecheck · lint · test · build · migrate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Domain dependency gate
        run: bun run check:domain-gate
      - name: Typecheck
        run: bun run typecheck
      - name: Lint (Biome)
        run: bun run lint
      - name: Test
        run: bun test
      - name: Start Postgres (docker compose)
        run: docker compose up -d
      - name: Apply migrations
        run: bun --cwd packages/db run migrate
      - name: Build
        run: bun run build
      - name: Stop Postgres
        if: always()
        run: docker compose down --volumes
